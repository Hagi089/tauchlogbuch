<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tauchlogbuch</title>
<meta name="theme-color" content="#0b3d5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="view-title">Tauchlogbuch</h1>
    <button id="theme-toggle" class="icon-btn" aria-label="Hell/Dunkel umschalten">🌙</button>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav">
    <button data-view="dashboard"><span class="glyph">📊</span>Dashboard</button>
    <button data-view="list"><span class="glyph">🤿</span>Tauchgänge</button>
    <button data-view="new"><span class="glyph">➕</span>Neu</button>
  </nav>
</div>

<script src="js/db.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
